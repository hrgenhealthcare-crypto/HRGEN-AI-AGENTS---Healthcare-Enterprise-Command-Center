name: HRGen Client Core Tests
on:
  pull_request:
    paths:
      - 'server.ts'
      - 'src/server/**'
      - 'tests/tenantCore.test.mjs'
      - '.github/workflows/hrgen-client-core-tests.yml'
  push:
    branches: [main]
    paths:
      - 'server.ts'
      - 'src/server/**'
      - 'tests/tenantCore.test.mjs'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check existing Express + React application
        run: npm run lint
      - name: Build application
        run: npm run build
      - name: Test real tenant core and isolation
        run: node --test tests/tenantCore.test.mjs
