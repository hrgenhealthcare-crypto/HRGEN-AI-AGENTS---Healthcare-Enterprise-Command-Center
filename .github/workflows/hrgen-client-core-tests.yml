name: HRGen Client Core Tests
on:
  pull_request:
    paths:
      - 'src/server/tenantCore.mjs'
      - 'src/server/tenantRoutes.mjs'
      - 'src/server/tenantUI.mjs'
      - 'tests/tenantCore.test.mjs'
      - '.github/workflows/hrgen-client-core-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/server/tenantCore.mjs'
      - 'src/server/tenantRoutes.mjs'
      - 'src/server/tenantUI.mjs'
      - 'tests/tenantCore.test.mjs'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node --test tests/tenantCore.test.mjs
