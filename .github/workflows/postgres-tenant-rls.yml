name: HRGen Isolated PostgreSQL Tenant RLS Gate
on:
  push:
    branches:
      - integration/security-crm-voice-20261108
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/test_postgres_tenant_rls.py'
      - '.github/workflows/postgres-tenant-rls.yml'
permissions:
  contents: read
jobs:
  postgres-rls:
    name: Postgres 16 SQL-level synthetic multi-tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-password-not-real
          POSTGRES_DB: hrgen_rls_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hrgen_rls_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-password-not-real
      PGDATABASE: hrgen_rls_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ephemeral database test driver
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Verify repo-owned SQL migrations against real isolated PostgreSQL
        run: python scripts/test_postgres_tenant_rls.py
