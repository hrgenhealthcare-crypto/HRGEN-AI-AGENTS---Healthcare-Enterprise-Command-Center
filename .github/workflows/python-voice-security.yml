name: HRGen Python Voice Ingress Security
on:
  push:
    branches: [audit/security-hardening-2026-11-05]
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/python-voice-security.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile backend Python source
        run: python -m compileall -q backend
      - name: Full FastAPI + ingress negative-access tests
        run: python -m unittest discover -s backend/tests -p 'test_*.py' -v
      - name: FastAPI import smoke
        run: python -c 'from backend.main import app; print("FastAPI voice service import OK")'
