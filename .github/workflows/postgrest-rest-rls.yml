name: HRGen Signed PostgREST HTTP Tenant Gate
on:
  push:
    branches:
      - integration/security-crm-voice-20261108
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/test_postgres_tenant_rls.py'
      - 'scripts/test_postgrest_http_e2e.py'
      - '.github/workflows/postgrest-rest-rls.yml'
permissions:
  contents: read
jobs:
  signed-rest:
    name: Actual PostgREST HTTP JWT + tenant RLS denial
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-password-not-real
          POSTGRES_DB: hrgen_rls_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hrgen_rls_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-password-not-real
      PGDATABASE: hrgen_rls_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install disposable PostgreSQL driver
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Prepare exact migrations and SQL synthetic security dataset
        run: python scripts/test_postgres_tenant_rls.py
      - name: Create CI-only authenticator and reset two synthetic grants
        run: python scripts/test_postgrest_http_e2e.py setup
      - name: Start pinned PostgREST v16.4 in isolated GitHub runner
        run: |
          docker run --detach --name hrgen-postgrest-rls-ci \
            --network host \
            --env PGRST_DB_URI="postgres://authenticator:synthetic-authenticator-postgrest-ci@127.0.0.1:5432/hrgen_rls_ci" \
            --env PGRST_DB_SCHEMAS=public \
            --env PGRST_DB_ANON_ROLE=anon \
            --env PGRST_JWT_SECRET=synthetic-postgrest-hs256-ci-secret-only-2026-11 \
            --env PGRST_SERVER_PORT=3011 \
            postgrest/postgrest:v16.4
          for i in {1..50}; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3011/ || true)
            if [ "$status" != "000" ] && [ "$status" != "503" ]; then
              echo "PostgREST endpoint responds on loopback"
              exit 0
            fi
            sleep 1
          done
          echo "PostgREST did not become ready"
          docker logs hrgen-postgrest-rls-ci --tail 60
          exit 1
      - name: Exercise signed HTTP PostgREST negative-access paths
        run: python scripts/test_postgrest_http_e2e.py test
      - name: Print isolated service diagnostics on failure
        if: failure()
        run: docker logs hrgen-postgrest-rls-ci --tail 75 || true
